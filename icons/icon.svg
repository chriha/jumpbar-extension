<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6cff"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f0589a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2a1458" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>
  <!-- faded result rows -->
  <rect x="120" y="352" width="272" height="30" rx="15" fill="#fff" fill-opacity="0.34"/>
  <rect x="152" y="400" width="208" height="26" rx="13" fill="#fff" fill-opacity="0.2"/>
  <!-- search bar -->
  <g filter="url(#shadow)">
    <rect x="84" y="150" width="344" height="168" rx="84" fill="#fff"/>
  </g>
  <!-- magnifier -->
  <circle cx="190" cy="232" r="32" fill="none" stroke="#6d5cf6" stroke-width="16"/>
  <path d="M214 256l30 30" stroke="#6d5cf6" stroke-width="16" stroke-linecap="round"/>
  <!-- caret + text hint -->
  <rect x="284" y="198" width="14" height="68" rx="7" fill="#f0589a"/>
  <rect x="318" y="224" width="66" height="16" rx="8" fill="#d9d9ec"/>
</svg>
